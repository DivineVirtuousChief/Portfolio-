name: Feature request
description: Propose a capability or improvement.
title: "[Feature]: "
labels: ["needs-triage", "type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or business problem should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Governance, privacy, or security constraints
    validations:
      required: false
