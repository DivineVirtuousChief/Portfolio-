name: Governed ChatOps CI
on:
  push:
    branches: [main, feature/governed-chatops-foundation]
    paths: ["chatops/**", ".github/workflows/chatops-ci.yml"]
  pull_request:
    paths: ["chatops/**", ".github/workflows/chatops-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test ChatOps
        working-directory: chatops
        run: npm run check
  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack if configured
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          RESULT: ${{ needs.test.result }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(jq -n --arg result "$RESULT" --arg repo "$REPOSITORY" --arg ref "$REF_NAME" --arg url "$RUN_URL" '{text: ("BGLA ChatOps CI: " + $result + " | " + $repo + " | " + $ref + " | " + $url)}')"
          curl --fail --silent --show-error --header "Content-Type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL"
      - name: Skip when no webhook is configured
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "SLACK_WEBHOOK_URL is not configured; notification skipped."