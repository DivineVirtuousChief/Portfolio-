name: OpenAPI Client Code Generation

on:
  pull_request:
    paths:
      - "openapi-codegen/**"
      - ".github/workflows/openapi-codegen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-clients:
    name: Validate spec and generate JS + TypeScript clients
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openapi-codegen/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install generator dependencies
        working-directory: openapi-codegen
        run: npm install --no-audit --no-fund

      - name: Check generator runner syntax
        working-directory: openapi-codegen
        run: node --check scripts/generate.mjs

      - name: Validate OpenAPI fixture
        working-directory: openapi-codegen
        run: npm run validate

      - name: Generate JavaScript and TypeScript clients
        working-directory: openapi-codegen
        run: npm run generate:all

      - name: Verify generated client directories
        working-directory: openapi-codegen
        shell: bash
        run: |
          test -d generated/javascript
          test -d generated/typescript-fetch
          test -f generated/javascript/README.md
          test -f generated/typescript-fetch/index.ts
          test -f generated/typescript-fetch/apis/PetsApi.ts
          test -f generated/typescript-fetch/models/Pet.ts

      - name: Commit generated clients to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: openapi-codegen
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f generated/
          if git diff --cached --quiet; then
            echo "Generated clients are already up to date."
          else
            git commit -m "chore: add generated JavaScript and TypeScript clients"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Upload generated clients for review
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated-clients
          path: openapi-codegen/generated/
          if-no-files-found: error
          retention-days: 7
