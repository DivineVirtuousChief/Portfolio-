name: Agent Knowledge Infrastructure

on:
  pull_request:
    paths:
      - "agent-knowledge/**"
      - ".github/workflows/agent-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-knowledge-layer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-knowledge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-knowledge/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and test
        run: npm run check
